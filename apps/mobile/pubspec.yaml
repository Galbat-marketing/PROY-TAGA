name: taga_mobile
description: TAGA ERP - App Móvil para Comerciales
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.6.0
  
  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # FP
  dartz: ^0.10.1
  
  # Networking
  supabase_flutter: ^2.8.0
  
  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # UI
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  mobile_scanner: ^6.0.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.3
  permission_handler: ^11.3.0
  
  # TAGA Core
  taga_shared:
    path: ../../packages/shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
